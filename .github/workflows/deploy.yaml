name: Build and Deploy
on:
  push:
    branches:
      - master  # or main, depending on your default branch

jobs:
  hosting:
    name: Deploy Website
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Checkout Repository
      - name: Checkout
        uses: actions/checkout@v3

      # Git configure
      - name: Setup git configs
        run: |
          git config --global user.name "akshaychavan7"
          git config --global user.email "akshaychavan.kkwedu@gmail.com"

      - name: Build and Deploy
        uses: JamesIves/github-pages-deploy-action@v4.4.1
        with:
          branch: gh-pages
          folder: src
          clean: true
          clean-exclude: |
            .git
            .github